<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Mídia Paga &mdash; ABC.inc &amp; Embralot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0A0E11; --surface: #14181C; --surface2: #1A1F24; --border: rgba(255,255,255,0.08);
    --text: #ECECE9; --muted: #948F87; --muted2: #6E6A64;
    --cream: #F5F2ED; --cream-text: #14181C; --cream-muted: #7A756C;
    --accent: #C7936B; --its: #C7936B; --targan: #9C8355; --vitreo: #8FB0BA;
    --meta: #8291A3; --google: #8FAE7C;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Manrope', sans-serif; padding: 0 0 60px; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .wrap { padding: 0 24px; }

  .hero-header {
    background: radial-gradient(120% 140% at 15% 0%, #10151a 0%, #0A0E11 55%, #050708 100%);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 30px 24px 26px; margin-bottom: 26px;
    display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 18px;
  }
  .brand-logo { height: 34px; width: auto; display: block; margin-bottom: 20px; opacity: 0.97; }
  h1 { font-size: 25px; font-weight: 300; margin: 0; letter-spacing: 0.01em; color: var(--text); }
  h1 b { font-weight: 600; }
  .subtitle { font-size: 12.5px; color: var(--muted); margin-top: 8px; font-weight: 300; letter-spacing: 0.02em; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab-btn {
    padding: 9px 18px; border-radius: 999px; font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase;
    font-family: 'Manrope', sans-serif; font-weight: 600;
    border: 1px solid rgba(255,255,255,0.18); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s ease;
  }
  .tab-btn:hover { border-color: rgba(255,255,255,0.4); color: var(--text); }
  .tab-btn.active { background: var(--text); color: #0A0E11; border-color: var(--text); }

  .filterbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; margin: 0 0 26px;
  }
  .filterbar .flabel { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted2); margin-right: 4px; }
  .filterbar input[type=date] { background: var(--surface2); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 6px 8px; color-scheme: dark; }
  .preset-btn { padding: 6px 13px; border-radius: 999px; font-size: 11px; letter-spacing: 0.03em; font-family: 'Manrope', sans-serif; font-weight: 600; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: var(--muted); cursor: pointer; }
  .preset-btn.active { background: var(--accent); border-color: var(--accent); color: #0A0E11; }
  .filter-range-label { font-size: 11.5px; color: var(--muted2); margin-left: auto; font-family: 'IBM Plex Mono', monospace; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 2px; margin-bottom: 22px; background: rgba(255,255,255,0.06); border-radius: 12px; overflow: hidden; }
  .kpi-card { background: var(--cream); padding: 22px 22px 20px; position: relative; }
  .kpi-label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cream-muted); margin-bottom: 10px; }
  .kpi-value { font-size: 32px; font-weight: 300; color: var(--cream-text); line-height: 1; }
  .kpi-sub { font-size: 11.5px; color: var(--cream-muted); margin-top: 8px; font-weight: 500; }

  .reach-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 30px; }
  .reach-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .reach-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted2); margin-bottom: 8px; }
  .reach-value { font-size: 21px; font-weight: 300; color: var(--text); }
  .reach-sub { font-size: 10.5px; color: var(--muted2); margin-top: 4px; }

  .card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
  .brand-section { margin-bottom: 34px; }
  .brand-title { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .brand-title h2 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  .platform-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .platform-card { flex: 1; min-width: 200px; background: var(--surface2); border-radius: 10px; padding: 15px 17px; border: 1px solid rgba(255,255,255,0.06); }
  .platform-head { display: flex; align-items: center; gap: 8px; margin-bottom: 11px; }
  .platform-head .dot { width: 7px; height: 7px; }
  .platform-head span.label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
  .platform-spend { font-size: 21px; font-weight: 300; }
  .platform-spend-label { font-size: 11px; color: var(--muted2); margin-top: 2px; }
  .platform-metrics { display: flex; flex-wrap: wrap; gap: 10px 0; justify-content: space-between; margin-top: 13px; font-size: 12px; }
  .platform-metrics > div { min-width: 62px; }
  .platform-metrics .m-val { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
  .platform-metrics .m-label { color: var(--muted2); font-size: 10px; }
  .empty-platform { flex: 1; min-width: 200px; display: flex; align-items: center; justify-content: center; color: #4B4A47; font-size: 12px; border: 1px dashed rgba(255,255,255,0.1); border-radius: 10px; }
  .chart-card { padding: 18px 18px 10px; }
  .chart-title { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; color: var(--muted2); text-transform: uppercase; margin-bottom: 10px; }
  .chart-wrap { height: 210px; }
  .section-title { font-size: 18px; font-weight: 300; margin-bottom: 4px; letter-spacing: 0.01em; }
  .section-title b { font-weight: 700; }
  .section-sub { font-size: 12px; color: var(--muted2); margin-bottom: 16px; }
  .subtabs { display: flex; gap: 20px; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .subtab-btn { padding: 8px 2px 12px; background: transparent; border: none; border-bottom: 2px solid transparent; font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase; font-family: 'Manrope', sans-serif; font-weight: 600; color: var(--muted2); cursor: pointer; }
  .subtab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .creatives-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .creative-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; transition: transform 0.15s ease; }
  .creative-card:hover { transform: translateY(-2px); }
  .creative-img-wrap { position: relative; width: 100%; padding-top: 62%; background: var(--bg); }
  .creative-img-wrap img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .play-badge {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 38px; height: 38px; border-radius: 50%; background: rgba(10,14,17,0.55);
    border: 1.5px solid rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center;
  }
  .play-badge svg { width: 13px; height: 13px; margin-left: 2px; }
  .badge { position: absolute; top: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; padding: 3px 8px; border-radius: 999px; background: rgba(10,14,17,0.9); letter-spacing: 0.04em; }
  .badge.brand { left: 8px; } .badge.rank { right: 8px; color: var(--text); }
  .origin-link {
    position: absolute; bottom: 8px; right: 8px; background: rgba(10,14,17,0.85); color: var(--text);
    font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; padding: 3px 8px; border-radius: 999px;
    text-decoration: none; letter-spacing: 0.02em; border: 1px solid rgba(255,255,255,0.15);
  }
  .origin-link:hover { border-color: var(--accent); color: var(--accent); }
  .creative-body { padding: 11px 13px 13px; }
  .creative-name { font-size: 12.5px; color: var(--text); font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .creative-camp { font-size: 10.5px; color: var(--muted2); margin-bottom: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .creative-stats { display: flex; flex-wrap: wrap; gap: 6px 0; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
  .creative-stats > div { min-width: 46px; }
  .creative-stats .cs-val { font-weight: 600; }
  .creative-stats .cs-label { color: var(--muted2); font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .ga-creative-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 15px 17px; display: flex; flex-direction: column; gap: 10px; }
  .ga-creative-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .ga-headline { font-size: 13px; color: var(--text); font-weight: 600; line-height: 1.4; }
  .ga-desc { font-size: 11.5px; color: var(--muted); line-height: 1.5; font-weight: 300; }
  .ga-meta-row { font-size: 10.5px; color: var(--muted2); }
  table.ga-table { width: 100%; border-collapse: collapse; }
  table.ga-table th, table.ga-table td { padding: 11px 14px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); }
  table.ga-table th { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted2); font-weight: 500; }
  table.ga-table td { font-size: 13px; color: #D4D2CE; font-weight: 300; }
  .table-card { padding: 0; overflow-x: auto; }
  .footer-note { margin-top: 30px; font-size: 11px; color: #4B4A47; text-align: center; letter-spacing: 0.02em; }
  .empty-msg { color: #4B4A47; font-size: 12.5px; padding: 20px; text-align: center; }
</style>
</head>

function topFbCreatives(brand, limit) {
  const agg = fbAggByAd();
  let list = Object.keys(agg).map(aid => {
    const meta = FB_ADS[aid]; if (!meta) return null;
    const a = agg[aid];
    return { ad_id: aid, brand: meta.brand, campaign: meta.campaign, ad_name: meta.ad_name, thumb: meta.thumb, link: meta.link, is_video: meta.is_video,
      spend: a.spend, impr: a.impr, clicks: a.clicks, leads: a.leads, reach: a.reach, eng: a.eng,
      ctr: a.impr > 0 ? (a.clicks / a.impr) * 100 : 0, cpl: a.leads > 0 ? a.spend / a.leads : null };
  }).filter(Boolean);
  if (brand !== "Todas") list = list.filter(c => c.brand === brand);
  list = list.filter(c => c.spend >= 15);
  list.sort((a, b) => (b.leads - a.leads) || ((a.cpl || 1e9) - (b.cpl || 1e9)));
  return list.slice(0, limit);
}
function topGaCreatives(brand, limit) {
  const agg = gaAggByAd();
  let list = Object.keys(agg).map(aid => {
    const meta = GA_ADS[aid]; if (!meta) return null;
    const a = agg[aid];
    return { ad_id: aid, brand: meta.brand, campaign: meta.campaign, ad_group: meta.ad_group, ad_type: meta.ad_type,
      headlines: meta.headlines, descriptions: meta.descriptions,
      spend: a.spend, impr: a.impr, clicks: a.clicks, conv: a.conv, inter: a.inter,
      ctr: a.impr > 0 ? (a.clicks / a.impr) * 100 : 0, cpl: a.conv > 0 ? a.spend / a.conv : null };
  }).filter(Boolean);
  if (brand !== "Todas") list = list.filter(c => c.brand === brand);
  list = list.filter(c => c.spend >= 10 && c.headlines);
  list.sort((a, b) => (b.conv - a.conv) || (b.ctr - a.ctr));
  return list.slice(0, limit);
}
function gaCampaignsAgg(brand) {
  const agg = gaAggByAd();
  const map = {};
  Object.keys(agg).forEach(aid => {
    const meta = GA_ADS[aid]; if (!meta) return;
    if (brand !== "Todas" && meta.brand !== brand) return;
    const key = meta.brand + "||" + meta.campaign;
    if (!map[key]) map[key] = { brand: meta.brand, campaign: meta.campaign, spend: 0, impr: 0, clicks: 0, conv: 0, inter: 0 };
    const a = agg[aid];
    map[key].spend += a.spend; map[key].impr += a.impr; map[key].clicks += a.clicks; map[key].conv += a.conv; map[key].inter += a.inter;
  });
  return Object.values(map).filter(c => c.spend > 0 || c.impr > 0).sort((a, b) => b.spend - a.spend);
}

function renderTabs() {
  const el = document.getElementById("tabs"); el.innerHTML = "";
  ["Todas", ...BRANDS].forEach(b => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (activeBrand === b ? " active" : "");
    btn.textContent = b;
    btn.onclick = () => { activeBrand = b; renderAll(); };
    el.appendChild(btn);
  });
}
function kpiCard(label, value, sub) { return `<div class="kpi-card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-sub">${sub}</div></div>`; }
function renderKpis() {
  const fbT = fbBrandTotals(), gaT = gaBrandTotals();
  const brandsToSum = activeBrand === "Todas" ? BRANDS : [activeBrand];
  let spend = 0, leads = 0;
  brandsToSum.forEach(b => { spend += fbT[b].spend + gaT[b].spend; leads += fbT[b].leads + gaT[b].conv; });
  const cpl = leads > 0 ? spend / leads : null;
  document.getElementById("kpiGrid").innerHTML =
    kpiCard("Investimento total", fmtBRL(spend), "Meta + Google · período selecionado") +
    kpiCard("Leads / Conversões", fmtNum(leads), activeBrand === "Todas" ? "somando as 3 marcas" : activeBrand) +
    kpiCard("CPL médio blended", fmtBRL2(cpl), "custo por lead no período") +
    kpiCard("Dias no período", (Math.round((new Date(rangeTo) - new Date(rangeFrom)) / 86400000) + 1), fmtDateBR(rangeFrom) + " – " + fmtDateBR(rangeTo));
}
function reachCard(label, value, sub) { return `<div class="reach-card"><div class="reach-label">${label}</div><div class="reach-value">${value}</div><div class="reach-sub">${sub}</div></div>`; }
function renderReach() {
  const r = reachTotalsForSelection();
  document.getElementById("reachGrid").innerHTML =
    reachCard("Alcance", fmtNum(r.reach), "pessoas alcançadas (soma por anúncio)") +
    reachCard("Impressões", fmtNum(r.impr), "exibições totais") +
    reachCard("Frequência média", r.freq != null ? fmtNum1(r.freq) : "—", "impressões por pessoa") +
    reachCard("Engajamento", fmtNum(r.eng), "curtidas + coment. + compart. + cliques") +
    reachCard("Taxa de engajamento", fmtPct(r.engRate), "engajamento / impressões") +
    reachCard("Cliques no link", fmtNum(r.linkclicks), "cliques que saíram do anúncio");
}
function platformCardHtml(platform, color, spend, secLabel, secVal, cpl, ctr, extra) {
  return `<div class="platform-card"><div class="platform-head"><span class="dot" style="background:${color}"></span><span class="label">${platform}</span></div>
    <div class="platform-spend">${fmtBRL(spend)}</div><div class="platform-spend-label">investido</div>
    <div class="platform-metrics"><div><div class="m-val">${secVal}</div><div class="m-label">${secLabel}</div></div>
    <div><div class="m-val">${cpl}</div><div class="m-label">CPL</div></div><div><div class="m-val">${ctr}</div><div class="m-label">CTR</div></div>
    ${extra || ""}</div></div>`;
}
function renderBrandSections() {
  const brandsToShow = activeBrand === "Todas" ? BRANDS : [activeBrand];
  const fbT = fbBrandTotals(), gaT = gaBrandTotals();
  const container = document.getElementById("brandSections"); container.innerHTML = "";
  Object.values(charts).forEach(c => c.destroy()); charts = {};

  brandsToShow.forEach(brand => {
    const fb = fbT[brand], gaS = gaT[brand];
    const hasGoogle = gaS && (gaS.spend > 0 || gaS.impr > 0);
    const fbCtr = fb.impr > 0 ? (fb.clicks / fb.impr) * 100 : 0;
    const fbCpl = fb.leads > 0 ? fb.spend / fb.leads : null;
    const gaCtr = hasGoogle && gaS.impr > 0 ? (gaS.clicks / gaS.impr) * 100 : 0;
    const gaCpl = hasGoogle && gaS.conv > 0 ? gaS.spend / gaS.conv : null;
    const fbExtra = `<div><div class="m-val">${fmtNum(fb.reach)}</div><div class="m-label">alcance</div></div><div><div class="m-val">${fmtNum(fb.eng)}</div><div class="m-label">engajam.</div></div>`;
    const gaExtra = hasGoogle ? `<div><div class="m-val">${fmtNum(gaS.inter)}</div><div class="m-label">interações</div></div>` : "";
    const section = document.createElement("div"); section.className = "brand-section";
    const chartId = "chart_" + brand.replace(/[^a-zA-Z0-9]/g, "_");
    section.innerHTML = `
      <div class="brand-title"><span class="dot" style="background:${ACCENT[brand]}"></span><h2>${brand}</h2></div>
      <div class="platform-row">
        ${platformCardHtml("Meta Ads", META_COLOR, fb.spend, "leads", fmtNum(fb.leads), fmtBRL2(fbCpl), fmtPct(fbCtr), fbExtra)}
        ${hasGoogle ? platformCardHtml("Google Ads", GOOGLE_COLOR, gaS.spend, "conversões", fmtNum(gaS.conv), fmtBRL2(gaCpl), fmtPct(gaCtr), gaExtra) : '<div class="empty-platform">Sem Google Ads no período</div>'}
      </div>
      <div class="card chart-card">
        <div class="chart-title">Investimento diário vs. leads/conversões</div>
        <div class="chart-wrap"><canvas id="${chartId}"></canvas></div>
      </div>`;
    container.appendChild(section);

    const series = brandDailySeries(brand);
    const labels = series.map(d => fmtDateBR(d.date));
    const datasets = [
      { label: "Invest. Meta (R$)", data: series.map(d => d.spend_meta), borderColor: META_COLOR, backgroundColor: "transparent", yAxisID: "y", tension: 0.3, pointRadius: 0, borderWidth: 2 },
      { label: "Leads Meta", data: series.map(d => d.leads_meta), borderColor: ACCENT[brand], backgroundColor: "transparent", yAxisID: "y1", tension: 0.3, pointRadius: 0, borderWidth: 2, borderDash: [4, 3] },
    ];
    if (hasGoogle) datasets.splice(1, 0, { label: "Invest. Google (R$)", data: series.map(d => d.spend_google), borderColor: GOOGLE_COLOR, backgroundColor: "transparent", yAxisID: "y", tension: 0.3, pointRadius: 0, borderWidth: 2 });

    const ctx = document.getElementById(chartId).getContext("2d");
    charts[chartId] = new Chart(ctx, {
      type: "line", data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
        plugins: { legend: { labels: { color: "#948F87", font: { size: 11, family: "Manrope" } } },
          tooltip: { backgroundColor: "#1A1F24", borderColor: "rgba(255,255,255,0.1)", borderWidth: 1, titleColor: "#ECECE9", bodyColor: "#D4D2CE" } },
        scales: {
          x: { ticks: { color: "#6E6A64", font: { size: 10 }, maxTicksLimit: 10 }, grid: { color: "rgba(255,255,255,0.04)" } },
          y: { position: "left", ticks: { color: "#6E6A64", font: { size: 10.5 } }, grid: { color: "rgba(255,255,255,0.05)" } },
          y1: { position: "right", ticks: { color: "#6E6A64", font: { size: 10.5 } }, grid: { display: false } },
        },
      },
    });
  });
}
function renderMetaCreatives() {
  const list = topFbCreatives(activeBrand, 9);
  if (!list.length) return '<div class="empty-msg">Nenhum criativo Meta com investimento relevante nesse período.</div>';
  return '<div class="creatives-grid">' + list.map((c, i) => `
    <div class="creative-card">
      <div class="creative-img-wrap">
        ${c.thumb ? `<img src="${c.thumb}" alt="${esc(c.ad_name)}" loading="lazy">` : ""}
        ${c.is_video ? `<span class="play-badge">${PLAY_SVG}</span>` : ""}
        <span class="badge brand" style="border:1px solid ${ACCENT[c.brand]};color:${ACCENT[c.brand]}">${c.brand}</span>
        <span class="badge rank">#${i + 1}</span>
        ${c.link ? `<a class="origin-link" href="${c.link}" target="_blank" rel="noopener">Ver original ↗</a>` : ""}
      </div>
      <div class="creative-body">
        <div class="creative-name" title="${esc(c.ad_name)}">${esc(c.ad_name)}</div>
        <div class="creative-camp" title="${esc(c.campaign)}">${esc(c.campaign)}</div>
        <div class="creative-stats">
          <div><div class="cs-val" style="color:${ACCENT[c.brand]}">${fmtNum(c.leads)}</div><div class="cs-label">leads</div></div>
          <div><div class="cs-val">${fmtBRL2(c.cpl)}</div><div class="cs-label">CPL</div></div>
          <div><div class="cs-val">${fmtPct(c.ctr)}</div><div class="cs-label">CTR</div></div>
          <div><div class="cs-val">${fmtNum(c.reach)}</div><div class="cs-label">alcance</div></div>
          <div><div class="cs-val">${fmtNum(c.eng)}</div><div class="cs-label">engaj.</div></div>
          <div><div class="cs-val">${fmtBRL(c.spend)}</div><div class="cs-label">gasto</div></div>
        </div>
      </div>
    </div>`).join("") + '</div>';
}
function renderGoogleCreatives() {
  const list = topGaCreatives(activeBrand, 9);
  if (!list.length) return '<div class="empty-msg">Nenhum anúncio de pesquisa do Google com dados de texto nesse período.</div>';
  return '<div class="creatives-grid">' + list.map((c, i) => {
    const firstHeadlines = (c.headlines || "").split(" | ").slice(0, 2).join(" · ");
    const firstDesc = (c.descriptions || "").split(" | ")[0] || "";
    return `<div class="ga-creative-card">
      <div class="ga-creative-top">
        <span class="badge brand" style="position:static;border:1px solid ${ACCENT[c.brand]};color:${ACCENT[c.brand]}">${c.brand}</span>
        <span class="mono" style="font-size:10px;color:var(--muted2)">#${i + 1} &middot; Rede de Pesquisa</span>
      </div>
      <div class="ga-headline">${esc(firstHeadlines)}</div>
      <div class="ga-desc">${esc(firstDesc)}</div>
      <div class="ga-meta-row">${esc(c.campaign)}</div>
      <div class="creative-stats">
        <div><div class="cs-val" style="color:${ACCENT[c.brand]}">${fmtNum(c.conv)}</div><div class="cs-label">conv.</div></div>
        <div><div class="cs-val">${fmtBRL2(c.cpl)}</div><div class="cs-label">CPL</div></div>
        <div><div class="cs-val">${fmtPct(c.ctr)}</div><div class="cs-label">CTR</div></div>
        <div><div class="cs-val">${fmtNum(c.inter)}</div><div class="cs-label">interaç.</div></div>
        <div><div class="cs-val">${fmtBRL(c.spend)}</div><div class="cs-label">gasto</div></div>
      </div>
    </div>`;
  }).join("") + '</div>';
}
function renderCreatives() {
  document.getElementById("creativesSub").textContent =
    activePlatformTab === "meta"
      ? "Meta Ads · ranqueados por leads gerados (mínimo R$15 investidos) no período selecionado · clique em “Ver original” para abrir o anúncio real"
      : "Google Ads · melhores anúncios de pesquisa por conversões e CTR (sem imagens — são campanhas de texto) no período selecionado";
  document.getElementById("creativesContainer").innerHTML = activePlatformTab === "meta" ? renderMetaCreatives() : renderGoogleCreatives();
}
function renderCampaignsTable() {
  const list = gaCampaignsAgg(activeBrand);
  const section = document.getElementById("gaCampaignsSection");
  if (!list.length) { section.style.display = "none"; return; }
  section.style.display = "";
  document.getElementById("campaignsSub").textContent = "Período selecionado · ordenado por investimento";
  document.getElementById("campaignsBody").innerHTML = list.map(c => {
    const ctr = c.impr > 0 ? (c.clicks / c.impr) * 100 : 0;
    const cpl = c.conv > 0 ? c.spend / c.conv : null;
    return `<tr>
      <td><span style="display:inline-flex;align-items:center;gap:6px"><span class="dot" style="width:7px;height:7px;background:${ACCENT[c.brand]}"></span>${c.brand}</span></td>
      <td>${esc(c.campaign)}</td><td class="mono">${fmtBRL2(c.spend)}</td><td class="mono">${fmtNum(c.impr)}</td><td class="mono">${fmtNum(c.clicks)}</td>
      <td class="mono">${fmtPct(ctr)}</td><td class="mono">${fmtNum(c.inter)}</td><td class="mono">${fmtNum(c.conv)}</td><td class="mono">${cpl ? fmtBRL2(cpl) : "—"}</td>
    </tr>`;
  }).join("");
}
function renderFilterBar() {
  document.getElementById("dateFrom").value = rangeFrom;
  document.getElementById("dateTo").value = rangeTo;
  document.getElementById("rangeInfo").textContent = fmtDateBR(rangeFrom) + " – " + fmtDateBR(rangeTo);
  document.getElementById("subtitleRange").textContent = "Período: " + fmtDateBR(rangeFrom) + " a " + fmtDateBR(rangeTo);
}
function setPreset(preset) {
  document.querySelectorAll(".preset-btn").forEach(b => b.classList.toggle("active", b.dataset.preset === preset));
  const maxD = new Date(DATA_MAX_DATE);
  if (preset === "all") { rangeFrom = DATA_MIN_DATE; rangeTo = DATA_MAX_DATE; }
  else {
    const days = parseInt(preset, 10);
    const from = new Date(maxD); from.setDate(from.getDate() - (days - 1));
    rangeFrom = from.toISOString().slice(0, 10); rangeTo = DATA_MAX_DATE;
  }
  renderFilterBar(); renderAll();
}
function initFilterBar() {
  document.getElementById("dateFrom").min = DATA_MIN_DATE; document.getElementById("dateFrom").max = DATA_MAX_DATE;
  document.getElementById("dateTo").min = DATA_MIN_DATE; document.getElementById("dateTo").max = DATA_MAX_DATE;
  document.querySelectorAll(".preset-btn").forEach(btn => btn.addEventListener("click", () => setPreset(btn.dataset.preset)));
  document.getElementById("dateFrom").addEventListener("change", e => {
    rangeFrom = e.target.value || DATA_MIN_DATE;
    if (rangeFrom > rangeTo) rangeTo = rangeFrom;
    document.querySelectorAll(".preset-btn").forEach(b => b.classList.remove("active"));
    renderFilterBar(); renderAll();
  });
  document.getElementById("dateTo").addEventListener("change", e => {
    rangeTo = e.target.value || DATA_MAX_DATE;
    if (rangeTo < rangeFrom) rangeFrom = rangeTo;
    document.querySelectorAll(".preset-btn").forEach(b => b.classList.remove("active"));
    renderFilterBar(); renderAll();
  });
  document.querySelectorAll(".subtab-btn").forEach(btn => btn.addEventListener("click", () => {
    activePlatformTab = btn.dataset.platform;
    document.querySelectorAll(".subtab-btn").forEach(b => b.classList.toggle("active", b === btn));
    renderCreatives();
  }));
}
function renderAll() {
  renderTabs(); renderKpis(); renderReach(); renderBrandSections(); renderCreatives(); renderCampaignsTable();
  document.getElementById("footerNote").textContent = "Dados de " + fmtDateBR(DATA_MIN_DATE) + " a " + fmtDateBR(DATA_MAX_DATE) + " · peça uma atualização para puxar dados novos";
}
initFilterBar(); renderFilterBar(); renderAll();
</script>
</body>
