<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Mídia Paga — Mirante Incorporações · Arboreto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F2E9; --surface: #FFFFFF; --surface2: #EFE6D6; --border: rgba(51,64,43,0.12);
    --text: #262A1F; --muted: #6E6A5A; --muted2: #A39C88;
    --forest: #33402B; --forest-light: #55684A; --forest-pale: #E4E9DC;
    --terracotta: #BE6A3E; --terracotta-light: #E2A57C; --terracotta-dark: #8F4E2C;
    --sand: #D7CDC6;
    --meta: #4E6E7E; --google: #A0793F;
    --hero-bg: #1F2919; --hero-text: #F3EFE3; --hero-muted: #9FAB8F;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 0 0 60px; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .serif { font-family: 'Fraunces', serif; }
  .wrap { padding: 0 28px; }

  .hero-header {
    background: radial-gradient(140% 160% at 8% 0%, #2C3924 0%, #1F2919 55%, #141B0F 100%);
    border-bottom: 3px solid var(--terracotta);
    padding: 30px 28px 24px; margin-bottom: 0; position: relative; overflow: hidden;
  }
  .hero-header::after {
    content: ""; position: absolute; top: -40%; right: -6%; width: 380px; height: 380px;
    border: 1px solid rgba(190,106,62,0.18); border-radius: 50%;
  }
  .hero-header::before {
    content: ""; position: absolute; top: -10%; right: 8%; width: 220px; height: 220px;
    border: 1px solid rgba(243,239,227,0.08); border-radius: 50%;
  }
  .brand-logo { height: 46px; width: auto; display: block; margin-bottom: 22px; position: relative; z-index: 1; }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; position: relative; z-index: 1; }
  h1 { font-family: 'Fraunces', serif; font-size: 27px; font-weight: 400; font-style: italic; margin: 0; letter-spacing: 0; color: var(--hero-text); }
  h1 b { font-weight: 600; font-style: normal; }
  .subtitle { font-size: 12.5px; color: var(--hero-muted); margin-top: 8px; font-weight: 400; letter-spacing: 0.02em; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab-btn {
    padding: 8px 16px; border-radius: 3px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    font-family: 'Inter', sans-serif; font-weight: 600;
    border: 1px solid rgba(243,239,227,0.3); background: transparent; color: var(--hero-muted); cursor: pointer; transition: all 0.15s ease;
  }
  .tab-btn:hover { border-color: rgba(243,239,227,0.55); color: var(--hero-text); }
  .tab-btn.active { background: var(--terracotta); color: #1F2919; border-color: var(--terracotta); }

  .filterbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: rgba(243,239,227,0.06); border: 1px solid rgba(243,239,227,0.16); border-radius: 4px;
    padding: 12px 16px; position: relative; z-index: 1;
  }
  .filterbar .flabel { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--hero-muted); margin-right: 4px; }
  .filterbar input[type=date] { background: #141B0F; border: 1px solid rgba(243,239,227,0.22); border-radius: 3px; color: var(--hero-text); font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 6px 8px; color-scheme: dark; }
  .preset-btn { padding: 6px 12px; border-radius: 3px; font-size: 11px; letter-spacing: 0.03em; font-family: 'Inter', sans-serif; font-weight: 600; border: 1px solid rgba(243,239,227,0.22); background: transparent; color: var(--hero-muted); cursor: pointer; }
  .preset-btn.active { background: var(--terracotta); border-color: var(--terracotta); color: #1F2919; }
  .filter-range-label { font-size: 11.5px; color: var(--hero-muted); margin-left: auto; font-family: 'JetBrains Mono', monospace; }

  .section-nav {
    display: flex; gap: 6px; background: var(--forest-pale); padding: 14px 28px;
    border-bottom: 1px solid var(--border); margin-bottom: 30px;
  }
  .section-nav-btn {
    padding: 9px 20px; border-radius: 3px; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase;
    font-family: 'Inter', sans-serif; font-weight: 700;
    border: 1px solid transparent; background: transparent; color: var(--forest-light); cursor: pointer; transition: all 0.15s ease;
  }
  .section-nav-btn:hover { background: rgba(51,64,43,0.08); }
  .section-nav-btn.active { background: var(--forest); color: var(--forest-pale); }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; margin-bottom: 26px; background: var(--terracotta-dark); border-radius: 6px; overflow: hidden; }
  .kpi-card { background: var(--terracotta); padding: 22px 22px 20px; position: relative; }
  .kpi-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(31,41,25,0.65); margin-bottom: 10px; }
  .kpi-value { font-family: 'Fraunces', serif; font-size: 34px; font-weight: 500; color: #1F2919; line-height: 1; }
  .kpi-sub { font-size: 11.5px; color: rgba(31,41,25,0.65); margin-top: 8px; font-weight: 500; }

  .reach-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 32px; }
  .reach-card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--forest-light); border-radius: 4px; padding: 16px 18px; }
  .reach-label { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted2); margin-bottom: 8px; }
  .reach-value { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; color: var(--text); }
  .reach-sub { font-size: 10.5px; color: var(--muted2); margin-top: 4px; }

  .card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 18px 20px; }
  .brand-section { margin-bottom: 36px; }
  .brand-title { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .brand-title h2 { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; margin: 0; letter-spacing: 0.005em; color: var(--forest); }
  .platform-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  .platform-card { flex: 1; min-width: 200px; background: var(--surface); border-radius: 4px; padding: 16px 18px; border: 1px solid var(--border); border-top: 3px solid var(--forest-light); }
  .platform-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .platform-head .dot { width: 7px; height: 7px; }
  .platform-head span.label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
  .platform-spend { font-family: 'Fraunces', serif; font-size: 23px; font-weight: 500; }
  .platform-spend-label { font-size: 11px; color: var(--muted2); margin-top: 2px; }
  .platform-metrics { display: flex; flex-wrap: wrap; gap: 10px 0; justify-content: space-between; margin-top: 14px; font-size: 12px; }
  .platform-metrics > div { min-width: 62px; }
  .platform-metrics .m-val { font-family: 'JetBrains Mono', monospace; font-weight: 500; }
  .platform-metrics .m-label { color: var(--muted2); font-size: 10px; }

  .section-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 400; font-style: italic; margin-bottom: 5px; letter-spacing: 0; color: var(--forest); }
  .section-title b { font-weight: 600; font-style: normal; }
  .section-sub { font-size: 12px; color: var(--muted2); margin-bottom: 18px; }
  .subtabs { display: flex; gap: 22px; margin-bottom: 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .subtab-btn { padding: 8px 2px 12px; background: transparent; border: none; border-bottom: 2px solid transparent; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; font-family: 'Inter', sans-serif; font-weight: 600; color: var(--muted2); cursor: pointer; }
  .subtab-btn.active { color: var(--forest); border-bottom-color: var(--terracotta); }

  .camp-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
  .camp-header { display: flex; align-items: center; gap: 10px; padding: 13px 16px; cursor: pointer; user-select: none; }
  .camp-header:hover { background: var(--forest-pale); }
  .camp-chevron { width: 9px; height: 9px; border-right: 1.5px solid var(--forest-light); border-bottom: 1.5px solid var(--forest-light); transform: rotate(-45deg); transition: transform 0.15s ease; flex-shrink: 0; margin-left: 2px; }
  .camp-card.open .camp-chevron { transform: rotate(45deg); }
  .camp-name { flex: 1; min-width: 140px; font-size: 13px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .camp-count { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted2); }
  .camp-metrics { display: flex; gap: 18px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; flex-wrap: wrap; }
  .camp-metrics > div { text-align: right; min-width: 52px; }
  .camp-metrics .cm-val { color: var(--text); font-weight: 600; }
  .camp-metrics .cm-label { color: var(--muted2); font-size: 9px; text-transform: uppercase; letter-spacing: 0.03em; }
  .camp-subrows { display: none; border-top: 1px solid var(--border); }
  .camp-card.open .camp-subrows { display: block; }
  .camp-subrow { display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 30px; border-top: 1px solid rgba(51,64,43,0.06); }
  .camp-subrow:first-child { border-top: none; }
  .camp-subrow-name { flex: 1; min-width: 120px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .camp-subrow .camp-metrics { font-size: 11px; }

  .creatives-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .creative-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; transition: transform 0.15s ease; }
  .creative-card:hover { transform: translateY(-3px); }
  .creative-img-wrap { position: relative; width: 100%; padding-top: 62%; background: var(--forest-pale); }
  .creative-img-wrap img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .play-badge {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 38px; height: 38px; border-radius: 50%; background: rgba(31,41,25,0.6);
    border: 1.5px solid rgba(243,239,227,0.75); display: flex; align-items: center; justify-content: center;
  }
  .play-badge svg { width: 13px; height: 13px; margin-left: 2px; }
  .badge { position: absolute; top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 9px; padding: 3px 8px; border-radius: 3px; background: rgba(31,41,25,0.9); letter-spacing: 0.04em; color: #F3EFE3; }
  .badge.brand { left: 8px; } .badge.rank { right: 8px; }
  .origin-link {
    position: absolute; bottom: 8px; right: 8px; background: rgba(31,41,25,0.88); color: #F3EFE3;
    font-family: 'JetBrains Mono', monospace; font-size: 9px; padding: 3px 8px; border-radius: 3px;
    text-decoration: none; letter-spacing: 0.02em; border: 1px solid rgba(243,239,227,0.2);
  }
  .origin-link:hover { border-color: var(--terracotta-light); color: var(--terracotta-light); }
  .creative-body { padding: 12px 14px 14px; }
  .creative-name { font-size: 12.5px; color: var(--text); font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .creative-camp { font-size: 10.5px; color: var(--muted2); margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .creative-stats { display: flex; flex-wrap: wrap; gap: 6px 0; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
  .creative-stats > div { min-width: 46px; }
  .creative-stats .cs-val { font-weight: 600; }
  .creative-stats .cs-label { color: var(--muted2); font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .ga-creative-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .ga-creative-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .ga-headline { font-family: 'Fraunces', serif; font-size: 15px; color: var(--forest); font-weight: 600; line-height: 1.4; }
  .ga-desc { font-size: 11.5px; color: var(--muted); line-height: 1.55; font-weight: 400; }
  .ga-meta-row { font-size: 10.5px; color: var(--muted2); }
  table.ga-table { width: 100%; border-collapse: collapse; }
  table.ga-table th, table.ga-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); }
  table.ga-table th { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted2); font-weight: 500; }
  table.ga-table td { font-size: 13px; color: #3D4534; font-weight: 400; }
  .table-card { padding: 0; overflow-x: auto; }
  .footer-note { margin-top: 32px; font-size: 11px; color: var(--muted2); text-align: center; letter-spacing: 0.02em; }
  .empty-msg { color: var(--muted2); font-size: 12.5px; padding: 20px; text-align: center; }
</style>
</head>

    if (!camps[meta.campaign]) camps[meta.campaign] = { name: meta.campaign, spend: 0, impr: 0, clicks: 0, leads: 0, subs: {} };
    const c = camps[meta.campaign];
    c.spend += a.spend; c.impr += a.impr; c.clicks += a.clicks; c.leads += a.leads;
    if (!c.subs[meta.adset]) c.subs[meta.adset] = { name: meta.adset, spend: 0, impr: 0, clicks: 0, leads: 0 };
    const s = c.subs[meta.adset];
    s.spend += a.spend; s.impr += a.impr; s.clicks += a.clicks; s.leads += a.leads;
  });
  return Object.values(camps).filter(c => c.spend > 0 || c.impr > 0)
    .map(c => ({ ...c, subs: Object.values(c.subs).filter(s => s.spend > 0 || s.impr > 0).sort((a,b) => b.spend - a.spend) }))
    .sort((a, b) => b.spend - a.spend);
}
function gaCampaignGroups() {
  const agg = gaAggByAd();
  const camps = {};
  Object.keys(agg).forEach(aid => {
    const meta = GA_ADS[aid]; if (!meta) return;
    const a = agg[aid];
    if (!camps[meta.campaign]) camps[meta.campaign] = { name: meta.campaign, spend: 0, impr: 0, clicks: 0, leads: 0, subs: {} };
    const c = camps[meta.campaign];
    c.spend += a.spend; c.impr += a.impr; c.clicks += a.clicks; c.leads += a.conv;
    if (!c.subs[meta.ad_group]) c.subs[meta.ad_group] = { name: meta.ad_group, spend: 0, impr: 0, clicks: 0, leads: 0 };
    const s = c.subs[meta.ad_group];
    s.spend += a.spend; s.impr += a.impr; s.clicks += a.clicks; s.leads += a.conv;
  });
  return Object.values(camps).filter(c => c.spend > 0 || c.impr > 0)
    .map(c => ({ ...c, subs: Object.values(c.subs).filter(s => s.spend > 0 || s.impr > 0).sort((a,b) => b.spend - a.spend) }))
    .sort((a, b) => b.spend - a.spend);
}
function campMetricsHtml(g, resultLabel) {
  const ctr = g.impr > 0 ? (g.clicks / g.impr) * 100 : 0;
  const cpl = g.leads > 0 ? g.spend / g.leads : null;
  return `<div class="camp-metrics">
    <div><div class="cm-val">${fmtBRL(g.spend)}</div><div class="cm-label">invest.</div></div>
    <div><div class="cm-val">${fmtNum(g.impr)}</div><div class="cm-label">impr.</div></div>
    <div><div class="cm-val">${fmtNum(g.clicks)}</div><div class="cm-label">cliques</div></div>
    <div><div class="cm-val">${fmtPct(ctr)}</div><div class="cm-label">ctr</div></div>
    <div><div class="cm-val">${fmtNum(g.leads)}</div><div class="cm-label">${resultLabel}</div></div>
    <div><div class="cm-val">${cpl ? fmtBRL2(cpl) : "—"}</div><div class="cm-label">cpl</div></div>
  </div>`;
}
function renderCampaignGroups(groups, resultLabel) {
  if (!groups.length) return '<div class="empty-msg">Sem campanhas nesse período.</div>';
  return groups.map((g, i) => `
    <div class="camp-card" id="camp_${i}">
      <div class="camp-header" onclick="document.getElementById('camp_${i}').classList.toggle('open')">
        <span class="camp-chevron"></span>
        <span class="camp-name" title="${esc(g.name)}">${esc(g.name)}</span>
        <span class="camp-count">${g.subs.length} conjunto${g.subs.length === 1 ? "" : "s"}</span>
        ${campMetricsHtml(g, resultLabel)}
      </div>
      <div class="camp-subrows">
        ${g.subs.map(s => `
          <div class="camp-subrow">
            <span class="camp-subrow-name" title="${esc(s.name)}">${esc(s.name)}</span>
            ${campMetricsHtml(s, resultLabel)}
          </div>`).join("")}
      </div>
    </div>`).join("");
}

function renderTabs() {
  document.getElementById("tabs").innerHTML = `<span class="tab-btn active" style="cursor:default">${PRODUCT}</span>`;
}
function kpiCard(label, value, sub) { return `<div class="kpi-card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-sub">${sub}</div></div>`; }
function renderKpis() {
  const fb = fbTotals(), ga = gaTotals();
  const includeFb = activeGeralMedia === "todas" || activeGeralMedia === "meta";
  const includeGa = activeGeralMedia === "todas" || activeGeralMedia === "google";
  let spend = 0, leads = 0;
  if (includeFb) { spend += fb.spend; leads += fb.leads; }
  if (includeGa) { spend += ga.spend; leads += ga.conv; }
  const cpl = leads > 0 ? spend / leads : null;
  const mediaLabels = { todas: "Meta + Google", meta: "Meta Ads", google: "Google Ads" };
  document.getElementById("kpiGrid").innerHTML =
    kpiCard("Investimento total", fmtBRL(spend), mediaLabels[activeGeralMedia] + " · período selecionado") +
    kpiCard("Leads / Conversões", fmtNum(leads), "Arboreto") +
    kpiCard("CPL médio blended", fmtBRL2(cpl), "custo por lead no período") +
    kpiCard("Dias no período", (Math.round((new Date(rangeTo) - new Date(rangeFrom)) / 86400000) + 1), fmtDateBR(rangeFrom) + " – " + fmtDateBR(rangeTo));
}
function reachCard(label, value, sub) { return `<div class="reach-card"><div class="reach-label">${label}</div><div class="reach-value">${value}</div><div class="reach-sub">${sub}</div></div>`; }
function renderReach() {
  const showReach = activeGeralMedia === "todas" || activeGeralMedia === "meta";
  document.getElementById("reachTitle").style.display = showReach ? "" : "none";
  document.getElementById("reachTitle").nextElementSibling.style.display = showReach ? "" : "none";
  document.getElementById("reachGrid").style.display = showReach ? "" : "none";
  if (!showReach) return;
  const r = reachTotalsForSelection();
  document.getElementById("reachGrid").innerHTML =
    reachCard("Alcance", fmtNum(r.reach), "pessoas alcançadas (soma por anúncio)") +
    reachCard("Impressões", fmtNum(r.impr), "exibições totais") +
    reachCard("Frequência média", r.freq != null ? fmtNum1(r.freq) : "—", "impressões por pessoa") +
    reachCard("Engajamento", fmtNum(r.eng), "curtidas + comentários + cliques") +
    reachCard("Taxa de engajamento", fmtPct(r.engRate), "engajamento / impressões") +
    reachCard("Cliques no link", fmtNum(r.linkclicks), "cliques que saíram do anúncio");
}
function platformCardHtml(platform, color, spend, secLabel, secVal, cpl, ctr, extra) {
  return `<div class="platform-card"><div class="platform-head"><span class="dot" style="background:${color}"></span><span class="label">${platform}</span></div>
    <div class="platform-spend">${fmtBRL(spend)}</div><div class="platform-spend-label">investido</div>
    <div class="platform-metrics"><div><div class="m-val">${secVal}</div><div class="m-label">${secLabel}</div></div>
    <div><div class="m-val">${cpl}</div><div class="m-label">CPL</div></div><div><div class="m-val">${ctr}</div><div class="m-label">CTR</div></div>
    ${extra || ""}</div></div>`;
}
function renderBrandSections() {
  const fb = fbTotals(), ga = gaTotals();
  const container = document.getElementById("brandSections"); container.innerHTML = "";
  const showMeta = activeGeralMedia === "todas" || activeGeralMedia === "meta";
  const showGoogle = activeGeralMedia === "todas" || activeGeralMedia === "google";

  const fbCtr = fb.impr > 0 ? (fb.clicks / fb.impr) * 100 : 0;
  const fbCpl = fb.leads > 0 ? fb.spend / fb.leads : null;
  const gaCtr = ga.impr > 0 ? (ga.clicks / ga.impr) * 100 : 0;
  const gaCpl = ga.conv > 0 ? ga.spend / ga.conv : null;
  const fbExtra = `<div><div class="m-val">${fmtNum(fb.reach)}</div><div class="m-label">alcance</div></div><div><div class="m-val">${fmtNum(fb.eng)}</div><div class="m-label">engajam.</div></div>`;
  const gaExtra = `<div><div class="m-val">${fmtNum(ga.inter)}</div><div class="m-label">interações</div></div>`;
  const section = document.createElement("div"); section.className = "brand-section";

  const fbGroups = showMeta ? fbCampaignGroups() : [];
  const gaGroups = showGoogle ? gaCampaignGroups() : [];

  section.innerHTML = `
    <div class="brand-title"><span class="dot" style="background:${ACCENT[PRODUCT]}"></span><h2>${PRODUCT}</h2></div>
    <div class="platform-row">
      ${showMeta ? platformCardHtml("Meta Ads", META_COLOR, fb.spend, "leads", fmtNum(fb.leads), fmtBRL2(fbCpl), fmtPct(fbCtr), fbExtra) : ""}
      ${showGoogle ? platformCardHtml("Google Ads", GOOGLE_COLOR, ga.spend, "conversões", fmtNum(ga.conv), fmtBRL2(gaCpl), fmtPct(gaCtr), gaExtra) : ""}
    </div>
    ${showMeta ? `<div style="font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.08em; color:var(--muted2); text-transform:uppercase; margin-bottom:8px;">Campanhas → conjuntos de anúncios · Meta Ads</div>
    <div style="margin-bottom:18px">${renderCampaignGroups(fbGroups, "leads")}</div>` : ""}
    ${showGoogle ? `<div style="font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.08em; color:var(--muted2); text-transform:uppercase; margin-bottom:8px;">Campanhas → grupos de anúncios · Google Ads</div>
    <div style="margin-bottom:18px">${renderCampaignGroups(gaGroups, "conv.")}</div>` : ""}
  `;
  container.appendChild(section);
}
function renderMetaCreatives() {
  const agg = fbAggByAd();
  let list = Object.keys(agg).map(aid => {
    const meta = FB_ADS[aid]; if (!meta) return null;
    const a = agg[aid];
    return { ad_id: aid, campaign: meta.campaign, ad_name: meta.ad_name, thumb: meta.thumb, link: meta.link, is_video: meta.is_video,
      spend: a.spend, impr: a.impr, clicks: a.clicks, leads: a.leads, reach: a.reach, eng: a.eng,
      ctr: a.impr > 0 ? (a.clicks / a.impr) * 100 : 0, cpl: a.leads > 0 ? a.spend / a.leads : null };
  }).filter(Boolean);
  list = list.filter(c => c.spend > 0);
  list.sort((a, b) => (b.leads - a.leads) || (b.eng - a.eng));
  list = list.slice(0, 9);
  if (!list.length) return '<div class="empty-msg">Nenhum criativo Meta com investimento nesse período.</div>';
  return '<div class="creatives-grid">' + list.map((c, i) => `
    <div class="creative-card">
      <div class="creative-img-wrap">
        ${c.thumb ? `<img src="${c.thumb}" alt="${esc(c.ad_name)}" loading="lazy">` : ""}
        ${c.is_video ? `<span class="play-badge">${PLAY_SVG}</span>` : ""}
        <span class="badge brand" style="border:1px solid ${ACCENT_LIGHT[PRODUCT]};color:${ACCENT_LIGHT[PRODUCT]}">${PRODUCT}</span>
        <span class="badge rank">#${i + 1}</span>
        ${c.link ? `<a class="origin-link" href="${c.link}" target="_blank" rel="noopener">Ver original ↗</a>` : ""}
      </div>
      <div class="creative-body">
        <div class="creative-name" title="${esc(c.ad_name)}">${esc(c.ad_name)}</div>
        <div class="creative-camp" title="${esc(c.campaign)}">${esc(c.campaign)}</div>
        <div class="creative-stats">
          <div><div class="cs-val" style="color:${ACCENT[PRODUCT]}">${fmtNum(c.leads)}</div><div class="cs-label">leads</div></div>
          <div><div class="cs-val">${fmtBRL2(c.cpl)}</div><div class="cs-label">CPL</div></div>
          <div><div class="cs-val">${fmtPct(c.ctr)}</div><div class="cs-label">CTR</div></div>
          <div><div class="cs-val">${fmtNum(c.reach)}</div><div class="cs-label">alcance</div></div>
          <div><div class="cs-val">${fmtNum(c.eng)}</div><div class="cs-label">engaj.</div></div>
          <div><div class="cs-val">${fmtBRL(c.spend)}</div><div class="cs-label">gasto</div></div>
        </div>
      </div>
    </div>`).join("") + '</div>';
}
function renderGoogleCreatives() {
  const agg = gaAggByAd();
  let list = Object.keys(agg).map(aid => {
    const meta = GA_ADS[aid]; if (!meta) return null;
    const a = agg[aid];
    return { ad_id: aid, campaign: meta.campaign, ad_group: meta.ad_group, ad_type: meta.ad_type,
      headlines: meta.headlines, descriptions: meta.descriptions,
      spend: a.spend, impr: a.impr, clicks: a.clicks, conv: a.conv, inter: a.inter,
      ctr: a.impr > 0 ? (a.clicks / a.impr) * 100 : 0, cpl: a.conv > 0 ? a.spend / a.conv : null };
  }).filter(Boolean);
  list = list.filter(c => c.spend >= 1 && c.headlines);
  list.sort((a, b) => (b.conv - a.conv) || (b.ctr - a.ctr));
  list = list.slice(0, 9);

  const videos = topGvCreatives(6);
  let videosHtml = "";
  if (videos.length) {
    videosHtml = `<div style="font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.08em; color:var(--muted2); text-transform:uppercase; margin-bottom:10px;">Vídeos no YouTube (Google Ads)</div>
    <div class="creatives-grid" style="margin-bottom:26px">` + videos.map((c, i) => `
      <div class="creative-card">
        <div class="creative-img-wrap">
          <img src="${c.thumb}" alt="${esc(c.title)}" loading="lazy">
          <span class="play-badge">${PLAY_SVG}</span>
          <span class="badge brand" style="border:1px solid ${ACCENT_LIGHT[PRODUCT]};color:${ACCENT_LIGHT[PRODUCT]}">${PRODUCT}</span>
          <span class="badge rank">#${i + 1}</span>
          <a class="origin-link" href="${c.link}" target="_blank" rel="noopener">Ver no YouTube ↗</a>
        </div>
        <div class="creative-body">
          <div class="creative-name" title="${esc(c.title)}">${esc(c.title)}</div>
          <div class="creative-camp" title="${esc(c.campaign)}">${esc(c.campaign)}</div>
          <div class="creative-stats">
            <div><div class="cs-val" style="color:${ACCENT[PRODUCT]}">${fmtNum(c.impr)}</div><div class="cs-label">impress.</div></div>
            <div><div class="cs-val">${fmtPct(c.ctr)}</div><div class="cs-label">CTR</div></div>
            <div><div class="cs-val">${fmtNum(c.clicks)}</div><div class="cs-label">cliques</div></div>
            <div><div class="cs-val">${fmtBRL(c.spend)}</div><div class="cs-label">gasto</div></div>
          </div>
        </div>
      </div>`).join("") + `</div>`;
  }

  if (!list.length && !videos.length) return '<div class="empty-msg">Nenhum criativo do Google com investimento nesse período.</div>';
  const searchHtml = list.length
    ? `<div style="font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.08em; color:var(--muted2); text-transform:uppercase; margin-bottom:10px;">Anúncios de Pesquisa (texto)</div><div class="creatives-grid">` + list.map((c, i) => {
    const firstHeadlines = (c.headlines || "").split(" | ").slice(0, 2).join(" · ");
    const firstDesc = (c.descriptions || "").split(" | ")[0] || "";
    return `<div class="ga-creative-card">
      <div class="ga-creative-top">
        <span class="badge brand" style="position:static;border:1px solid ${ACCENT[PRODUCT]};color:${ACCENT[PRODUCT]}">${PRODUCT}</span>
        <span class="mono" style="font-size:10px;color:var(--muted2)">#${i + 1} · Rede de Pesquisa</span>
      </div>
      <div class="ga-headline">${esc(firstHeadlines)}</div>
      <div class="ga-desc">${esc(firstDesc)}</div>
      <div class="ga-meta-row">${esc(c.campaign)}</div>
      <div class="creative-stats">
        <div><div class="cs-val" style="color:${ACCENT[PRODUCT]}">${fmtNum(c.conv)}</div><div class="cs-label">conv.</div></div>
        <div><div class="cs-val">${fmtBRL2(c.cpl)}</div><div class="cs-label">CPL</div></div>
        <div><div class="cs-val">${fmtPct(c.ctr)}</div><div class="cs-label">CTR</div></div>
        <div><div class="cs-val">${fmtNum(c.inter)}</div><div class="cs-label">interaç.</div></div>
        <div><div class="cs-val">${fmtBRL(c.spend)}</div><div class="cs-label">gasto</div></div>
      </div>
    </div>`;
  }).join("") + '</div>'
    : '<div class="empty-msg">Nenhum anúncio de pesquisa com dados de texto nesse período.</div>';

  return videosHtml + searchHtml;
}
function renderCreatives() {
  const subs = {
    meta: "Meta Ads · ranqueados por leads gerados no período selecionado · clique em “Ver original” para abrir o anúncio real",
    google: "Google Ads · vídeos do YouTube por impressões, e anúncios de pesquisa por conversões e CTR, no período selecionado",
  };
  document.getElementById("creativesSub").textContent = subs[activePlatformTab];
  const renderers = { meta: renderMetaCreatives, google: renderGoogleCreatives };
  document.getElementById("creativesContainer").innerHTML = renderers[activePlatformTab]();
}
function renderFilterBar() {
  document.getElementById("dateFrom").value = rangeFrom;
  document.getElementById("dateTo").value = rangeTo;
  document.getElementById("rangeInfo").textContent = fmtDateBR(rangeFrom) + " – " + fmtDateBR(rangeTo);
}
function setPreset(preset) {
  document.querySelectorAll(".preset-btn").forEach(b => b.classList.toggle("active", b.dataset.preset === preset));
  const maxD = new Date(DATA_MAX_DATE);
  if (preset === "all") { rangeFrom = DATA_MIN_DATE; rangeTo = DATA_MAX_DATE; }
  else {
    const days = parseInt(preset, 10);
    const from = new Date(maxD); from.setDate(from.getDate() - (days - 1));
    rangeFrom = from.toISOString().slice(0, 10); rangeTo = DATA_MAX_DATE;
  }
  renderFilterBar(); renderAll();
}
function initFilterBar() {
  document.getElementById("dateFrom").min = DATA_MIN_DATE; document.getElementById("dateFrom").max = DATA_MAX_DATE;
  document.getElementById("dateTo").min = DATA_MIN_DATE; document.getElementById("dateTo").max = DATA_MAX_DATE;
  document.querySelectorAll(".preset-btn").forEach(btn => btn.addEventListener("click", () => setPreset(btn.dataset.preset)));
  document.getElementById("dateFrom").addEventListener("change", e => {
    rangeFrom = e.target.value || DATA_MIN_DATE;
    if (rangeFrom > rangeTo) rangeTo = rangeFrom;
    document.querySelectorAll(".preset-btn").forEach(b => b.classList.remove("active"));
    renderFilterBar(); renderAll();
  });
  document.getElementById("dateTo").addEventListener("change", e => {
    rangeTo = e.target.value || DATA_MAX_DATE;
    if (rangeTo < rangeFrom) rangeFrom = rangeTo;
    document.querySelectorAll(".preset-btn").forEach(b => b.classList.remove("active"));
    renderFilterBar(); renderAll();
  });
  document.querySelectorAll(".subtab-btn[data-platform]").forEach(btn => btn.addEventListener("click", () => {
    activePlatformTab = btn.dataset.platform;
    document.querySelectorAll(".subtab-btn[data-platform]").forEach(b => b.classList.toggle("active", b === btn));
    renderCreatives();
  }));
  document.querySelectorAll(".geral-media-btn").forEach(btn => btn.addEventListener("click", () => {
    activeGeralMedia = btn.dataset.media;
    document.querySelectorAll(".geral-media-btn").forEach(b => b.classList.toggle("active", b === btn));
    renderKpis(); renderReach(); renderBrandSections();
  }));
  document.querySelectorAll(".section-nav-btn").forEach(btn => btn.addEventListener("click", () => {
    activeSection = btn.dataset.section;
    document.querySelectorAll(".section-nav-btn").forEach(b => b.classList.toggle("active", b === btn));
    document.getElementById("sectionGeral").style.display = activeSection === "geral" ? "" : "none";
    document.getElementById("sectionCriativos").style.display = activeSection === "criativos" ? "" : "none";
  }));
}
function renderAll() {
  renderTabs(); renderKpis(); renderReach(); renderBrandSections(); renderCreatives();
  document.getElementById("footerNote").textContent = "Dados de " + fmtDateBR(DATA_MIN_DATE) + " a " + fmtDateBR(DATA_MAX_DATE) + " · campanha em fase de lançamento · peça uma atualização para puxar dados novos";
}
initFilterBar(); renderFilterBar(); renderAll();
</script>
